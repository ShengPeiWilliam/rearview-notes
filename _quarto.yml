# Settings every post shares. Each post is posts/NN-name/post.qmd, rendered to one
# self-contained index.html beside it, which GitHub Pages serves.
format:
  html:
    output-file: index.html
    code-fold: true
    format-links: false
    embed-resources: true
    fig-width: 7
    fig-height: 3.5

execute:
  echo: true
  warning: false
  message: false
